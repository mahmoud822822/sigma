name: Sigma Auto Update - كل 3 ساعات
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sigma_site.json with caps
        run: python3 build_sigma.py
      - name: Commit and push JSON
        run: |
          git config user.name "sigma-bot"
          git config user.email "sigma-bot@github.com"
          git add sigma_site.json build_sigma.py .github/workflows/sigma-auto.yml
          git diff --cached --quiet || git commit -m "Auto update sigma_site.json cap 86 risk 13"
          git push
