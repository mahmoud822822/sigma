name: Sigma Auto Update
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 sigma_forecaster.py || echo "forecaster skip"
      - run: python3 sigma_embed_real.py || echo "embed skip"
      - run: git config user.name "sigma-bot" && git config user.email "bot@sigma.app" && git add -A && git commit -m "Auto Sigma Update" || echo "no changes"
      - run: git push || echo "push skip"
