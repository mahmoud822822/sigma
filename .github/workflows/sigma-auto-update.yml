name: Sigma 3-Hourly
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install requests supabase python-dotenv numpy pandas scipy || true
          [ -f requirements.txt ] && pip install -r requirements.txt || true
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 sigma_engine.py
      - run: |
          git config user.name "Sigma Bot"
          git config user.email "bot@sigma.local"
          git add -A
          git commit -m "Auto update" || true
          git pull --rebase origin main || true
          git push
\n      - name: Cap probabilities\n        run: python3 cap_after_generate.py\n