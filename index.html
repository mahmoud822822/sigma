<script>
let FAV=JSON.parse(localStorage.getItem("sigma_fav")||"[]");function togFav(k){FAV=FAV.includes(k)?FAV.filter(x=>x!==k):[...FAV,k];localStorage.setItem("sigma_fav",JSON.stringify(FAV));rn()}
let LIVE=[];
async function pullLive(){
  try{
    const r=await fetch("https://espn.com");
    const d=await r.json();
    LIVE=(d.events||[]).filter(e=>e.status?.type?.state==="in").map(e=>{
      const c=e.competitions?.[0]?.competitors||[];
      const hm=c.find(x=>x.homeAway==="home")||c[0]||{};
      const aw=c.find(x=>x.homeAway==="away")||c[1]||{};
      return {home:hm.team?.displayName||"",away:aw.team?.displayName||"",hs:hm.score||"0",as:aw.score||"0",clk:e.status?.displayClock||"LIVE",lg:e.league?.name||""};
    });
    if(T==="live")applyLang(); rn();
  }catch(e){}
}
pullLive(); setInterval(pullLive,30000);
let CMP=false;
function togView(){CMP=!CMP;localStorage.setItem("sigma_cmp",CMP?"1":"0");vbtn.textContent=CMP?"📊 مفصّل":"⚡ مضغوط";rn()}
function stB(t,e){document.querySelectorAll(".bitem").forEach(x=>x.classList.remove("on"));e.classList.add("on");st(t,e)}
function togAI(){aibox.style.display=aibox.style.display==="block"?"none":"block"}
function askAI(mode){
  let list=[...A];
  if(mode==="top3") list=list.filter(m=>m.golden).sort((a,b)=>b.conf-a.conf).slice(0,3);
  else if(mode==="safe") list=list.sort((a,b)=>b.dc_prob-a.dc_prob).slice(0,3);
  else if(mode==="goals") list=list.filter(m=>m.over25>=62).sort((a,b)=>b.over25-a.over25).slice(0,3);
  else if(mode==="arab") list=list.filter(m=>/egy|ksa|sau|uae|qat|mar|tun|alg|caf|afc|ahly|zamalek|hilal|nassr/i.test(`${m.league} ${m.league_name} ${m.home} ${m.away}`)).sort((a,b)=>b.conf-a.conf).slice(0,3);
  if(!list.length){aians.innerHTML="لا توجد مباريات مطابقة حالياً في هذا التصنيف.";return;}
  aians.innerHTML=list.map((m,idx)=>`<div style="margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)"><b style="color:var(--gd)">${idx+1}. ${m.home} vs ${m.away}</b><br>🎯 التوقع: <b style="color:var(--ac)">${m.pick==="1"?"فوز "+m.home:m.pick==="2"?"فوز "+m.away:"تعادل"} (${sigmaCap(m.conf,m.elo_h,m.elo_a)}%)</b> • أمان ${m.dc_pick}: ${Math.min(86,m.dc_prob)}% • +2.5: ${m.over25}%</div>`).join("");
}
let LANG=localStorage.getItem("sigma_lang")||"ar";
const DICT={
  ar:{all:"كل الأوقات",today:"⚡ اليوم",tom:"📅 غداً",cons:"🧠 إجماع 3/3",o25:"⚽ +2.5 هدف",arab:"🇸🇦🇪🇬 الدوريات العربية",clash:"🔥 قمم وديربيات",ph:"🔍 ابحث عن فريق أو بطولة...",gold:"⭐ ذهبي",win:"فوز",draw:"تعادل",safe:"أمان",adv:"📊 عرض الأسواق المتقدمة وأسباب الذكاء"},
  en:{all:"All Dates",today:"⚡ Today",tom:"📅 Tomorrow",cons:"🧠 3/3 Consensus",o25:"⚽ Over 2.5",arab:"🇸🇦🇪🇬 Arab Leagues",clash:"🔥 Big Clashes",ph:"🔍 Search team or league...",gold:"⭐ GOLDEN",win:"WIN",draw:"DRAW",safe:"Safe",adv:"📊 Advanced Markets & AI Insights"}
};
function applyLang(){
  const d=DICT[LANG];
  document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  document.documentElement.lang=LANG;
  if(window.lbtn) lbtn.textContent=LANG==="ar"?"🌐 EN":"🌐 عربي";
  if(window.q) q.placeholder=d.ph;
  const qp=document.querySelectorAll(".qpill");
  if(qp.length>=7){qp[0].textContent=d.all;qp[1].textContent=d.today;qp[2].textContent=d.tom;qp[3].textContent=d.cons;qp[4].textContent=d.o25;qp[5].textContent=d.arab;qp[6].textContent=d.clash;}
}
function togLang(){LANG=LANG==="ar"?"en":"ar";localStorage.setItem("sigma_lang",LANG);applyLang();rn();}
function renderBrief(list){
  if(!list.length||T!=="all"){return "";}
  const best=[...list].sort((a,b)=>b.conf-a.conf);
  const topG=[...list].sort((a,b)=>b.over25-a.over25);
  return `<div class="card" style="border-color:rgba(16,185,129,.45);background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(13,21,38,.95));padding:10px 12px">
    <div style="font-size:.74rem;font-weight:800;color:var(--ac);margin-bottom:4px">⚡ ملخص الذكاء الاصطناعي الفوري (${list.length} مباراة مطابقة)</div>
    <div style="font-size:.71rem;color:var(--tx);line-height:1.6">
      👑 <b>أقوى ترشيح:</b> ${best.home} vs ${best.away} (<span style="color:var(--gd)">${best.conf}%</span>)<br>
      ⚽ <b>أعلى مباراة أهدافاً:</b> ${topG.home} vs ${topG.away} (<span style="color:var(--bl)">+2.5: ${topG.over25}%</span>)
    </div>
  </div>`;
