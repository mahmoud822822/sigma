<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA AI V81 PRO</title>
<style>:root{--bg:#0b1120;--card:#131c31;--ac:#10b981;--gd:#f59e0b;--rd:#ef4444;--tx:#f1f5f9;--mt:#94a3b8;--bd:#1e293b}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:var(--bg);color:var(--tx);padding:12px;max-width:900px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:10px}.stats,.tabs{display:grid;gap:6px;margin-bottom:10px}.stats{grid-template-columns:repeat(3,1fr)}.tabs{grid-template-columns:repeat(5,1fr)}.box,.tab,input,select,.card,.pager button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px}.box{padding:10px;text-align:center}.box b{color:var(--ac);font-size:1.1rem;display:block}.tab{padding:8px 2px;font-weight:700;font-size:.74rem;cursor:pointer;text-align:center}.tab.on{background:var(--ac);color:#052e16}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}input,select{padding:9px;font-size:.82rem;width:100%}.card{padding:11px;margin-bottom:9px}.card.gold{border-color:var(--gd)}.top,.teams,.row{display:flex;justify-content:space-between;align-items:center}.top{font-size:.74rem;color:var(--mt);margin-bottom:7px}.teams{font-weight:700;font-size:.9rem;margin-bottom:8px}.probs,.met{display:grid;gap:5px;text-align:center}.probs{grid-template-columns:repeat(3,1fr);margin-bottom:7px}.met{grid-template-columns:repeat(4,1fr);background:#0f172a;padding:6px;border-radius:8px;font-size:.73rem}.pill{background:#0f172a;padding:5px 3px;border-radius:7px;font-size:.75rem;border:1px solid var(--bd)}.pill.pk{border-color:var(--ac);color:var(--ac);font-weight:700}.b-gd{color:var(--gd);font-weight:700}.b-ok{color:var(--ac);font-weight:700}.b-no{color:var(--rd);font-weight:700}.pager{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.pager button{padding:9px 14px;font-weight:700}</style></head>
<body><header><div id="u" style="font-size:.74rem;color:var(--mt)">...</div><div style="text-align:left"><h2 style="color:var(--ac);font-size:1.15rem">SIGMA AI V81 PRO ⚡</h2><small style="color:var(--gd)">Mahmoud Emad</small></div></header>
<div class="stats"><div class="box"><b id="s1">0</b><small>قادمة</small></div><div class="box"><b id="s2">0%</b><small>دقة التقييم</small></div><div class="box"><b id="s3">0</b><small>أرشيف</small></div></div>
<div class="tabs"><div class="tab on" onclick="st('all',this)">التوقعات</div><div class="tab" onclick="st('gold',this)">الذهبية ⭐</div><div class="tab" onclick="st('o25',this)">+2.5 هدف 🔥</div><div class="tab" onclick="st('res',this)">النتائج 📊</div><div class="tab" onclick="st('elo',this)">Elo</div></div>
<div class="filters" id="fb"><input id="q" placeholder="🔍 بحث بفريق أو بطولة..." oninput="pg=1;rn()"><select id="df" onchange="pg=1;rn()"><option value="all">📅 كل الشهر (30 يوم)</option><option value="today">اليوم</option><option value="tom">غداً</option><option value="o65">+2.5 هدف فوق 65%</option></select></div>
<button onclick="cpTop()" style="width:100%;padding:9px;margin-bottom:10px;background:#1e293b;color:#f59e0b;border:1px solid #f59e0b;border-radius:10px;font-weight:700;cursor:pointer">📋 نسخ أقوى 5 ترشيحات اليوم</button><div id="ls"></div><div class="pager" id="pb"><button onclick="pg--;rn()" id="b1">⬅️ السابق</button><span id="pi" style="font-size:.8rem;color:var(--mt)">1</span><button onclick="pg++;rn()" id="b2">التالي ➡️</button></div>
<script>let A=[],R=[],T="all",pg=1,pp=25;fetch("data/sigma_site.json?t="+Date.now()).then(r=>r.json()).then(d=>{u.textContent=(d.generated_utc||"").slice(0,16).replace("T"," ");s1.textContent=(d.stats?.upcoming||0).toLocaleString();s2.textContent=(d.stats?.hit_pct||0)+"%";s3.textContent=(d.stats?.history_count||0).toLocaleString();A=d.matches||[];R=d.recent_results||[];rn()});function st(t,e){T=t;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));e.classList.add("on");fb.style.display=t==="res"?"none":"grid";pg=1;rn()}function rn(){if(T==="res"){pb.style.display="none";ls.innerHTML=R.length?R.map(r=>`<div class="card"><div class="top"><span>🏆 ${(r.league||"").toUpperCase()} • ${r.date}</span><span class="${r.hit?"b-ok":"b-no"}">${r.hit?"✅ ناجح":"❌ لم يصب"}</span></div><div class="teams"><span>${r.home}</span><span style="color:var(--gd)">${r.result}</span><span>${r.away}</span></div><div class="row" style="font-size:.78rem;color:var(--mt)"><span>توقع: <b>${r.pick==="1"?r.home:r.pick==="2"?r.away:"تعادل"}</b></span><span>ثقة: <b>${r.conf}%</b></span></div></div>`).join(""):"<div class=card>لا توجد نتائج بعد</div>";return}pb.style.display="flex";const qv=q.value.trim().toLowerCase(),dv=df.value,td=new Date().toISOString().slice(0,10),tm=new Date(Date.now()+864e5).toISOString().slice(0,10);let w=A.filter(m=>(T!=="gold"||m.golden||m.conf>=58)&&(T!=="o25"||m.over25>=58)&&(dv!=="today"||m.date===td)&&(dv!=="tom"||m.date===tm)&&(dv!=="o65"||m.over25>=65)&&(!qv||`${m.home} ${m.away} ${m.league}`.toLowerCase().includes(qv)));if(T==="o25")w.sort((a,b)=>b.over25-a.over25);else if(T==="gold")w.sort((a,b)=>b.conf-a.conf);else if(T==="elo")w.sort((a,b)=>Math.abs(b.elo_home-b.elo_away)-Math.abs(a.elo_home-a.elo_away));const tp=Math.max(1,Math.ceil(w.length/pp));pg=Math.min(Math.max(1,pg),tp);pi.textContent=`صفحة ${pg}/${tp} (${w.length})`;b1.disabled=pg<=1;b2.disabled=pg>=tp;ls.innerHTML=w.slice((pg-1)*pp,pg*pp).map(m=>`<div class="card ${m.golden?"gold":""}"><div class="top"><span>🏆 ${m.league.toUpperCase()} • ${m.date}</span><span class="${m.golden?"b-gd":""}">${m.golden?"⭐ توقع ذهبي":"ثقة "+m.grade}</span></div><div class="teams"><span>🏟️ ${m.home}</span><span style="color:var(--mt)">VS</span><span>✈️ ${m.away}</span></div><div style="text-align:center;font-size:.78rem;color:#10b981;font-weight:700;margin-bottom:6px">🎯 الترشيح: ${m.pick==="1"?"فوز "+m.home:m.pick==="2"?"فوز "+m.away:"تعادل"} (${m.conf}%)</div><div class="probs"><div class="pill ${m.pick==="1"?"pk":""}">${m.home.slice(0,13)}: ${m.p1}%</div><div class="pill ${m.pick==="X"?"pk":""}">تعادل: ${m.pX}%</div><div class="pill ${m.pick==="2"?"pk":""}">${m.away.slice(0,13)}: ${m.p2}%</div></div><div style="font-size:.72rem;color:#38bdf8;margin-bottom:6px;background:#0f172a;padding:5px 8px;border-radius:7px">${m.intel||"📊 تحليل Elo + Poisson"}</div><div class="met"><div>+2.5 هدف<br><b>${m.over25}%</b></div><div>BTTS<br><b>${m.btts}%</b></div><div>xG<br><b>${m.xg_home}-${m.xg_away}</b></div><div>النتيجة<br><b>${(m.top_scores||["1-0"]).join(" | ")}</b></div></div></div>`).join("")||"<div class=card>لا توجد مباريات</div>"}function cpTop(){const top=A.filter(m=>m.golden||m.conf>=60).slice(0,5).map(m=>`⚽ ${m.home} vs ${m.away} (${m.date}) -> ${m.pick==="1"?m.home:m.pick==="2"?m.away:"تعادل"} (${m.conf}%) | +2.5: ${m.over25}%`).join("\n");navigator.clipboard.writeText("⚡ ترشيحات SIGMA AI:\n"+top);alert("تم نسخ أقوى 5 ترشيحات بنجاح!");}</script></body></html>
