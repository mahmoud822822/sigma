<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sigma AI V75</title><link rel="manifest" href="manifest.json"><style>:root{--bg:#090d16;--card:#131b2e;--accent:#10b981;--gold:#f59e0b;--text:#f3f4f6;--muted:#9ca3af}*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding-bottom:50px}header{background:#0f172a;padding:14px;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:1.2rem;color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;max-width:650px;margin:auto}.sbox{background:var(--card);padding:10px;border-radius:12px;text-align:center}.sbox b{display:block;font-size:1.1rem;color:var(--accent)}.nav{display:flex;gap:6px;padding:0 12px 12px;max-width:650px;margin:auto}.nav button{flex:1;padding:10px;background:var(--card);border:1px solid #374151;color:#fff;border-radius:10px;font-weight:700}.nav button.active{background:var(--accent);color:#000}.wrap{padding:0 12px;max-width:650px;margin:auto}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #1f2937}.card.golden{border-color:var(--gold)}.teams{display:flex;justify-content:space-between;font-weight:700;margin:8px 0}.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.prob{background:#0b1120;padding:6px;border-radius:8px}.prob.win{border:1px solid var(--accent);color:var(--accent);font-weight:700}input{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #374151;background:#0b1120;color:#fff}.btn{width:100%;padding:12px;background:var(--accent);color:#000;border:none;border-radius:10px;font-weight:700}</style></head><body><header><div><h1>⚡ SIGMA AI V75</h1><small style="color:var(--gold)">Mahmoud Emad</small></div><small id="lu"></small></header><div class="stats"><div class="sbox"><b id="su">-</b><span>قادمة</span></div><div class="sbox"><b id="sa">-</b><span>دقة</span></div><div class="sbox"><b id="sh">-</b><span>أرشيف</span></div></div><div class="nav"><button class="active" onclick="tab(1,this)">التوقعات</button><button onclick="tab(2,this)">الذهبية</button><button onclick="tab(3,this)">Elo</button><button onclick="tab(4,this)">Value</button></div><div class="wrap" id="v"></div><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});let D={matches:[],top_elo:[],stats:{}};fetch("./data/sigma_site.json?t="+Date.now()).then(r=>r.json()).then(d=>{D=d;document.getElementById("lu").textContent=(d.generated_utc||"").slice(0,16);document.getElementById("su").textContent=d.stats.upcoming||0;document.getElementById("sa").textContent=(d.stats.hit_pct||0)+"%";document.getElementById("sh").textContent=(d.stats.history_count||0).toLocaleString();tab(1,document.querySelector(".nav button"))});function tab(n,b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");const v=document.getElementById("v");if(n===1||n===2){const L=n===2?D.matches.filter(m=>m.golden):D.matches;v.innerHTML=L.length?L.map(m=>`<div class="card ${m.golden?"golden":""}"><small style="color:var(--muted)">${m.league} • ${m.date}</small><div class="teams"><span>${m.home} (${m.elo_home})</span><span style="color:var(--accent)">VS</span><span>${m.away} (${m.elo_away})</span></div><div class="probs"><div class="prob ${m.pick==="1"?"win":""}">1: ${m.p1}%</div><div class="prob ${m.pick==="X"?"win":""}">X: ${m.pX}%</div><div class="prob ${m.pick==="2"?"win":""}">2: ${m.p2}%</div></div><small style="display:block;margin-top:8px;color:var(--muted)">+2.5: ${m.over25}% | BTTS: ${m.btts}% | Top: ${(m.top_scores||[]).join(", ")}</small></div>`).join(""):"<div class=card>لا توجد مباريات</div>"}else if(n===3){v.innerHTML="<div class=card>"+(D.top_elo||[]).map((t,i)=>`<div style=display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1f2937><span>${i+1}. ${t.team}</span><b>${t.elo}</b></div>`).join("")+"</div>"}else{v.innerHTML=`<div class=card><h3>Value & Kelly</h3><input id=bk type=number value=1000 placeholder="رأس المال"><input id=od type=number step=0.01 value=2.10 placeholder="الأودز"><input id=pr type=number value=60 placeholder="الاحتمال %"><button class=btn onclick="const bk=+document.getElementById(\x27bk\x27).value,od=+document.getElementById(\x27od\x27).value,pr=+document.getElementById(\x27pr\x27).value/100,ed=pr*od-1;document.getElementById(\x27vr\x27).textContent=ed>0.03?\x27✅ Value +\x27+(ed*100).toFixed(1)+\x27%\x27:\x27❌ No Value\x27">احسب</button><p id=vr></p></div>`}}</script></body></html>
