:root{
  --bg:#d8f2e2;
  --surface:#ffffff;
  --ink:#10271d;
  --muted:#66796f;
  --primary:#0b9a6a;
  --primary-dark:#067a53;
  --mint:#e7f8ef;
  --pink:#ffe8f1;
  --pink-ink:#a42a5f;
  --line:#d7ece0;
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 28px;
  background:var(--bg)
}

.phone{
  width:min(100%,430px);
  margin:0 auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px
}

.topbar{
  display:flex;
  align-items:center;
  gap:11px;
  background:var(--surface);
  border:1px solid #cfe9da;
  border-radius:20px;
  padding:13px 14px;
  box-shadow:0 6px 18px rgba(16,60,40,.07)
}

.logo-mark{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:14px;
  background:var(--primary);
  color:white;
  display:grid;
  place-items:center;
  font-size:27px;
  font-weight:900
}

.eyebrow{
  font-size:11px;
  letter-spacing:1.2px;
  color:var(--primary);
  font-weight:900
}

.topbar h1{
  font-size:clamp(19px,5.2vw,23px);
  line-height:1.15;
  margin:2px 0 3px
}

.topbar p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4
}

.live-dot{
  margin-inline-start:auto;
  background:#fff2d6;
  color:#8a5b00;
  border:1px solid #f2d28d;
  border-radius:999px;
  padding:6px 9px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

.live-dot.local{
  background:#ffe8f1;
  color:var(--pink-ink);
  border-color:#ffc6da
}

.card{
  background:var(--surface);
  border:1px solid #d8eee2;
  border-radius:18px;
  padding:15px;
  box-shadow:0 5px 16px rgba(16,60,40,.05)
}

.card-label{
  font-size:11px;
  font-weight:800;
  color:var(--primary);
  letter-spacing:.2px
}

h2{
  font-size:clamp(18px,5vw,21px);
  line-height:1.25;
  margin:3px 0
}

h3{
  font-size:16px;
  margin:2px 0
}

.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
  margin:8px 0
}

.status-head{
  display:flex;
  gap:11px;
  align-items:flex-start
}

.icon-box{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:var(--mint);
  color:var(--primary-dark);
  display:grid;
  place-items:center
}

.status-head h2{
  font-size:17px
}

.count-badge{
  margin-inline-start:auto;
  background:var(--ink);
  color:white;
  border-radius:999px;
  padding:6px 8px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

.server-line{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  background:#f3fbf7;
  border:1px dashed #bfe5d1;
  border-radius:11px;
  padding:10px;
  font-size:11px;
  line-height:1.5;
  word-break:break-word
}

.server-line span:last-child{
  font-family:monospace;
  direction:ltr
}

.sep{
  color:#b7c8bf
}

.btn-primary{
  width:100%;
  border:0;
  border-radius:12px;
  background:var(--primary);
  color:white;
  padding:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:12px
}

.btn-primary:hover{
  background:var(--primary-dark)
}

.note{
  font-size:11px;
  color:var(--muted);
  text-align:center;
  margin-top:9px;
  line-height:1.5
}

.section-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  padding:2px 2px 10px
}

.section-head.no-pad{
  padding:0 0 12px
}

.source-pill{
  flex:0 0 auto;
  background:white;
  border:1px solid #cfe9da;
  color:#31594a;
  border-radius:999px;
  padding:6px 8px;
  font-size:11px;
  font-weight:800
}

.stack{
  display:flex;
  flex-direction:column;
  gap:14px
}

.match-card{
  padding:0;
  overflow:hidden
}

.match-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  background:#f4fbf7;
  padding:11px 14px;
  font-size:12px;
  font-weight:800
}

.match-top .src{
  color:var(--primary-dark)
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  padding:14px 12px 10px;
  text-align:center
}

.teams strong{
  display:block;
  font-size:14px;
  line-height:1.35
}

.teams span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px
}

.vs b{
  display:block;
  font-size:16px;
  letter-spacing:1px;
  margin-top:2px
}

.odds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:0 12px 12px
}

.odds span{
  background:#f5fbf8;
  border:1px solid #e3f1e9;
  border-radius:10px;
  padding:8px;
  text-align:center;
  font-size:12px;
  color:var(--muted)
}

.odds b{
  display:block;
  color:var(--ink);
  font-size:15px;
  margin-top:2px
}

.pick-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid #e7f1ec;
  padding:11px 13px
}

.pick{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:800;
  font-size:13px;
  color:#8a4b00
}

.conf{
  background:var(--mint);
  color:var(--primary-dark);
  border-radius:999px;
  padding:5px 8px;
  font-size:11px;
  font-weight:800
}

.coupon-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px
}

.badge-server,.badge-local{
  font-size:11px;
  font-weight:800;
  border-radius:999px;
  padding:6px 8px;
  white-space:nowrap
}

.badge-server{
  background:#e4f9ef;
  color:#076d48;
  border:1px solid #b6ecd1
}

.badge-local{
  background:#ffe8f1;
  color:var(--pink-ink);
  border:1px solid #ffc6da
}

.coupon ul{
  list-style:none;
  padding:0;
  margin:13px 0;
  border-top:1px solid #eef4f0
}

.coupon li{
  padding:9px 0;
  border-bottom:1px solid #eef4f0;
  font-size:13px;
  line-height:1.5
}

.coupon-total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--ink);
  color:white;
  border-radius:12px;
  padding:13px
}

.coupon-total strong{
  font-size:24px;
  color:#8ff5bd
}

.coupon-foot{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  margin-top:11px
}

.combined{
  background:linear-gradient(135deg,#0b9a6a,#0a6d68);
  color:white;
  border:0
}

.combined>span{
  font-size:12px;
  opacity:.9
}

.combined>div{
  display:flex;
  align-items:baseline;
  gap:8px;
  margin:8px 0
}

.combined strong{
  font-size:38px;
  line-height:1
}

.combined p{
  margin:0;
  font-size:12px;
  line-height:1.6;
  opacity:.95
}

.big-total{
  display:flex;
  align-items:baseline;
  gap:9px;
  background:var(--mint);
  border-radius:13px;
  padding:13px
}

.big-total strong{
  font-size:34px;
  line-height:1
}

.big-total span{
  font-size:12px;
  color:var(--muted)
}

.tournament-status{
  font-size:12px;
  font-weight:800;
  color:var(--primary-dark);
  margin:11px 0 7px
}

.table{
  border-top:1px solid #e8f1eb
}

.th,.tr{
  display:grid;
  grid-template-columns:1.6fr .6fr .6fr;
  gap:8px;
  padding:10px 2px;
  align-items:center
}

.th{
  font-size:11px;
  color:var(--muted)
}

.tr{
  border-top:1px solid #eef3f0;
  font-size:13px
}

.tr b{
  text-align:center
}

.ok{
  color:var(--primary-dark);
  font-weight:800;
  text-align:center
}

.btn-ghost{
  width:100%;
  margin-top:11px;
  background:#f5fbf8;
  border:1px solid #d9eee3;
  border-radius:11px;
  padding:10px;
  color:#205a43;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px
}

.ai-result{
  display:flex;
  gap:10px;
  align-items:flex-start;
  color:#1d5a40;
  background:#eefaf3;
  margin-bottom:12px
}

.ai-result p{
  margin:0;
  font-size:13px;
  line-height:1.6
}

.ai-row{
  padding:12px
}

.ai-main{
  display:flex;
  align-items:center;
  gap:10px
}

.ai-num{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:10px;
  background:#eef2ff;
  color:#3649a5;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:12px
}

.ai-main strong{
  display:block;
  font-size:13px
}

.ai-main span{
  display:block;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
  margin-top:2px
}

.ai-main .conf{
  margin-inline-start:auto
}

.ai-foot{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:11px;
  padding-top:10px;
  border-top:1px solid #edf2ef;
  font-size:11px;
  color:var(--muted)
}

.btn-small{
  margin-inline-start:auto;
  border:0;
  background:var(--ink);
  color:white;
  border-radius:9px;
  padding:8px 9px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:5px
}

.btn-small:disabled{
  opacity:.6
}

.calc-head{
  display:flex;
  gap:11px;
  align-items:center
}

.calc-head .source-pill{
  margin-inline-start:auto
}

.calc label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-top:13px
}

.calc input{
  width:100%;
  border:1px solid #d2e5da;
  border-radius:11px;
  padding:12px;
  margin-top:6px;
  background:#fbfefc;
  outline:none;
  color:var(--ink)
}

.calc input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px #d9f4e6
}

.calc-out{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px
}

.calc-out>div{
  background:#f4fbf7;
  border:1px solid #dff0e6;
  border-radius:12px;
  padding:12px
}

.calc-out span{
  display:block;
  font-size:11px;
  color:var(--muted)
}

.calc-out strong{
  display:block;
  font-size:21px;
  margin-top:4px
}

.calc-msg{
  background:#fff7df;
  border-radius:10px;
  padding:10px;
  font-size:12px;
  line-height:1.6;
  margin:11px 0 0
}

.quick{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center;
  margin-top:12px;
  font-size:12px
}

.quick button{
  border:1px solid #d5e7dc;
  background:white;
  border-radius:999px;
  padding:7px 10px;
  font-weight:800
}

.quick button.active{
  background:var(--primary);
  color:white;
  border-color:var(--primary)
}

.excluded{
  display:flex;
  flex-direction:column;
  gap:10px
}

.ex-item{
  display:flex;
  align-items:center;
  gap:9px;
  background:var(--pink);
  border:1px solid #ffc9dd;
  color:#6b1738;
  border-radius:13px;
  padding:12px;
  font-size:13px
}

.ex-item small{
  margin-inline-start:auto;
  font-weight:800;
  white-space:nowrap
}

footer{
  background:#10271d;
  color:#d6ece1;
  border-radius:20px;
  padding:18px 16px
}

.foot-logo{
  display:flex;
  align-items:center;
  gap:8px;
  color:white
}

.foot-logo span{
  width:32px;
  height:32px;
  border-radius:10px;
  background:var(--primary);
  display:grid;
  place-items:center;
  font-size:19px
}

.foot-logo small{
  margin-inline-start:auto;
  font-size:10px;
  letter-spacing:1px;
  opacity:.7
}

footer>p{
  font-size:12px;
  line-height:1.75;
  margin:14px 0
}

.foot-links{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  font-size:11px;
  padding-top:13px;
  border-top:1px solid #2d4a3e
}

.foot-links span{
  display:flex;
  align-items:center;
  gap:5px
}

footer>small{
  display:block;
  color:#8eae9f;
  font-size:10px;
  line-height:1.6;
  margin-top:12px
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#10271d;
    --surface:#1a3329;
    --ink:#edfbf3;
    --muted:#a9c4b5;
    --mint:#213f32;
    --line:#2d4a3e;
    --pink:#3d2230;
    --pink-ink:#ffb7cf
  }

  .card,.topbar{
    border-color:#2d4a3e;
    box-shadow:none
  }

  .match-top,.odds span,.calc-out>div,.server-line,.btn-ghost,.calc input{
    background:#203d30;
    border-color:#2d4a3e
  }

  .source-pill{
    background:#203d30;
    border-color:#2d4a3e;
    color:#cde9da
  }

  .coupon li,.pick-row,.ai-foot,.th,.tr{
    border-color:#2d4a3e
  }

  .ex-item{
    background:#3d2230;
    border-color:#5b2b42
  }

  footer{
    background:#071a12
  }
}

@media (max-width:390px){
  .phone{
    padding:12px;
    gap:12px
  }

  .topbar{
    padding:11px
  }

  .teams{
    gap:4px;
    padding:12px 7px 8px
  }

  .teams strong{
    font-size:13px
  }

  .coupon-foot,.ai-foot{
    flex-wrap:wrap
  }

  .btn-small{
    margin-inline-start:0
  }

  .foot-logo small{
    display:none
  }
}
